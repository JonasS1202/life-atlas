<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atlas · Calendar, Coach &amp; Brain Hub</title>
<style>
:root{
  --bg:#070a0f;--surface:#0d121b;--surface-2:#121926;--surface-3:#182234;--border:rgba(255,255,255,0.075);
  --border-hi:rgba(255,255,255,0.15);--text:#f1f5f9;--text-dim:#cbd5e1;--muted:#64748b;--muted-hi:#94a3b8;
  --accent:#38bdf8;--accent-glow:rgba(56,189,248,0.16);
  --workout:#10b981;--workout-bg:rgba(16,185,129,0.14);--workout-tx:#a7f3d0;
  --plan:#0ea5e9;--plan-bg:rgba(14,165,233,0.14);--plan-tx:#bae6fd;
  --goal:#f59e0b;--goal-bg:rgba(245,158,11,0.15);--goal-tx:#fde68a;
  --blocked:#f43f5e;--blocked-bg:rgba(244,63,94,0.15);--blocked-tx:#fecdd3;
  --event:#8b5cf6;--event-bg:rgba(139,92,246,0.15);--event-tx:#ddd6fe;
  --deadline:#f97316;--deadline-bg:rgba(249,115,22,0.14);--deadline-tx:#fed7aa;
  --todo:#38bdf8;--todo-bg:rgba(56,189,248,0.14);--todo-tx:#e0f2fe;
  --bday:#ec4899;--bday-bg:rgba(236,72,153,0.15);--bday-tx:#fbcfe8;
  --radius:12px;--radius-sm:8px
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body{background-image:radial-gradient(ellipse 80% 35% at 50% -10%,rgba(56,189,248,0.09),transparent);min-height:100vh}
.shell{max-width:1760px;margin:0 auto;padding:16px 20px 32px;display:flex;flex-direction:column;gap:14px}
@media(max-width:768px){.shell{padding:12px}}

/* Topbar */
.topbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;background:rgba(13,18,27,0.85);backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 8px 30px rgba(0,0,0,0.35)}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand-icon{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#0284c7,#38bdf8);display:flex;align-items:center;justify-content:center;font-size:1rem;box-shadow:0 0 18px rgba(56,189,248,0.35);flex-shrink:0}
.brand-title{font-size:1.05rem;font-weight:700;letter-spacing:-0.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sub{font-size:.72rem;color:var(--muted-hi);display:flex;align-items:center;gap:6px}
.live-pill{display:inline-flex;align-items:center;gap:5px;font-size:.68rem;font-weight:600;color:#34d399;background:rgba(16,185,129,0.12);border:1px solid rgba(16,185,129,0.28);padding:2px 8px;border-radius:99px}
.live-dot{width:6px;height:6px;border-radius:50%;background:#10b981;box-shadow:0 0 8px #10b981;animation:pulse 2.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--surface-2);padding:3px;border-radius:9px;border:1px solid var(--border);gap:2px}
.seg button{background:transparent;color:var(--muted-hi);border:none;padding:5px 11px;border-radius:6px;cursor:pointer;font-size:.78rem;font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:all .15s ease;white-space:nowrap}
.seg button:hover{color:var(--text);background:rgba(255,255,255,0.04)}
.seg button.active{background:var(--surface-3);color:#fff;box-shadow:0 1px 4px rgba(0,0,0,0.4),inset 0 0 0 1px rgba(56,189,248,0.35)}
.cnt{font-size:.66rem;padding:1px 5px;border-radius:99px;background:rgba(255,255,255,0.07);color:var(--text-dim);font-weight:600}
.seg button.active .cnt{background:rgba(56,189,248,0.22);color:var(--accent)}

.search-wrap{position:relative;display:flex;align-items:center}
.search-in{background:var(--surface-2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:5px 10px 5px 26px;font-size:.78rem;width:155px;transition:all .15s ease;outline:none}
.search-in:focus{border-color:var(--accent);width:210px;background:var(--surface-3)}
.search-ico{position:absolute;left:8px;font-size:.72rem;color:var(--muted);pointer-events:none}

.nav-grp{display:inline-flex;align-items:center;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:2px}
.nav-btn{background:transparent;color:var(--text-dim);border:none;padding:5px 9px;border-radius:6px;cursor:pointer;font-size:.78rem;font-weight:600;transition:all .15s}
.nav-btn:hover{background:var(--surface-3);color:#fff}
.nav-label{min-width:138px;text-align:center;font-weight:700;font-size:.82rem;color:var(--text);padding:0 8px;cursor:pointer}

/* Telemetry & KPI Strip */
.kpi-strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media(max-width:960px){.kpi-strip{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.kpi-strip{grid-template-columns:1fr}}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 13px;display:flex;flex-direction:column;gap:3px;min-width:0;position:relative;overflow:hidden}
.kpi.clickable{cursor:pointer;transition:border-color .15s,background .15s}
.kpi.clickable:hover{border-color:var(--border-hi);background:var(--surface-2)}
.kpi::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:var(--kpi-color,var(--accent));opacity:.75}
.kpi-lbl{font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted-hi);font-weight:600;display:flex;justify-content:space-between;align-items:center}
.kpi-val{font-size:1.05rem;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi-sub{font-size:.72rem;color:var(--muted-hi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Athlete Telemetry Ribbon (Adaptive Simple / Standard / Pro Coach View) */
.coach-ribbon{background:linear-gradient(180deg,rgba(16,185,129,0.08),rgba(13,18,27,0.9));border:1px solid rgba(16,185,129,0.25);border-radius:var(--radius);padding:11px 14px;display:none;flex-direction:column;gap:9px}
.coach-ribbon.simple-mode{background:linear-gradient(180deg,rgba(56,189,248,0.08),rgba(13,18,27,0.9));border-color:rgba(56,189,248,0.24)}
.coach-ribbon.show{display:flex}
.coach-hdr{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.coach-title{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#34d399;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.coach-ribbon.simple-mode .coach-title{color:#7dd3fc}
.rdy-badge{font-size:.66rem;font-weight:800;padding:2px 8px;border-radius:99px;letter-spacing:.04em;display:inline-flex;align-items:center;gap:5px}
.rdy-GREEN{background:rgba(16,185,129,0.18);color:#6ee7b7;border:1px solid rgba(16,185,129,0.4)}
.rdy-AMBER{background:rgba(245,158,11,0.18);color:#fde68a;border:1px solid rgba(245,158,11,0.4)}
.rdy-RED{background:rgba(244,63,94,0.2);color:#fda4af;border:1px solid rgba(244,63,94,0.45)}
.phys-chips{display:flex;flex-wrap:wrap;gap:7px}
.phys-chip{background:rgba(15,23,42,0.85);border:1px solid rgba(255,255,255,0.09);border-radius:7px;padding:4px 9px;font-size:.74rem;display:inline-flex;align-items:center;gap:6px}
.phys-chip.pro-hi{border-color:rgba(56,189,248,0.32);background:rgba(14,165,233,0.1)}
.phys-chip span.k{color:var(--muted-hi);font-weight:500}
.phys-chip strong.v{color:var(--text);font-weight:700}
.macro-banner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:7px 10px;border-radius:8px;background:rgba(15,23,42,0.75);border:1px solid rgba(56,189,248,0.2);font-size:.74rem}
.macro-badges{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pmc-strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) minmax(160px,1.4fr);gap:8px;align-items:center;padding:8px 10px;border-radius:9px;background:rgba(7,10,15,0.62);border:1px solid rgba(255,255,255,0.08)}
@media(max-width:960px){.pmc-strip{grid-template-columns:repeat(3,minmax(0,1fr))}}
.pmc-cell{display:flex;flex-direction:column;gap:1px;min-width:0}
.pmc-lbl{font-size:.63rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted-hi);font-weight:600}
.pmc-val{font-size:.9rem;font-weight:800;color:var(--text)}
.pmc-spark{width:100%;height:36px;display:block}
.guardrail-bar{font-size:.72rem;padding:6px 10px;border-radius:7px;background:rgba(245,158,11,0.12);border:1px solid rgba(245,158,11,0.3);color:#fde68a;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.kw-phase{font-size:.54rem;font-weight:700;text-transform:uppercase;padding:1px 4px;border-radius:3px;background:rgba(56,189,248,0.16);color:var(--accent);margin-top:3px;letter-spacing:.03em;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wko-bars{display:flex;align-items:flex-end;gap:1.5px;height:12px;margin-top:3px;padding:1px 2px;background:rgba(0,0,0,0.25);border-radius:3px;overflow:hidden}
.wko-bar{min-width:2px;border-radius:1px 1px 0 0;opacity:.92}
.fb-badge{font-size:.58rem;font-weight:700;padding:0 4px;border-radius:3px;margin-left:auto;flex-shrink:0}
.fb-badge.ok{background:rgba(16,185,129,0.2);color:#6ee7b7}
.fb-badge.warn{background:rgba(245,158,11,0.22);color:#fde68a}
.pcurve-tbl{width:100%;border-collapse:collapse;font-size:.7rem;margin-top:4px}
.pcurve-tbl th,.pcurve-tbl td{padding:4px 5px;text-align:right;border-bottom:1px solid var(--border)}
.pcurve-tbl th:first-child,.pcurve-tbl td:first-child{text-align:left;font-weight:700;color:var(--muted-hi)}
.pcurve-tbl th{font-size:.62rem;text-transform:uppercase;color:var(--muted)}
.mini-tabs{display:inline-flex;gap:3px;background:var(--surface-2);padding:2px;border-radius:6px;border:1px solid var(--border)}
.mini-tabs button{background:transparent;border:none;color:var(--muted-hi);font-size:.66rem;font-weight:700;padding:2px 7px;border-radius:4px;cursor:pointer}
.mini-tabs button.active{background:var(--surface-3);color:var(--accent)}

/* Interactive Checkbox Button */
.cb-btn{width:17px;height:17px;border-radius:4px;border:1.5px solid rgba(148,163,184,0.55);background:rgba(15,23,42,0.75);color:transparent;display:inline-flex;align-items:center;justify-content:center;font-size:.68rem;font-weight:900;cursor:pointer;flex-shrink:0;transition:all .14s ease;padding:0;line-height:1}
.cb-btn:hover{border-color:var(--accent);background:rgba(56,189,248,0.16)}
.cb-btn.done{background:rgba(16,185,129,0.25);border-color:#10b981;color:#6ee7b7}
.row.is-done .row-title{text-decoration:line-through;opacity:.62}

/* Main Workspace Layout */
.workspace{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:14px;align-items:start}
@media(max-width:1120px){.workspace{grid-template-columns:minmax(0,1fr)}}

/* Calendar & Brain Graph Main Box */
.cal-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,0.3);min-width:0;position:relative}

/* Brain Graph Canvas & Overlay Controls */
.graph-wrap{position:relative;width:100%;height:640px;background:radial-gradient(circle at 50% 45%,rgba(30,41,59,0.42),rgba(7,10,15,0.96));overflow:hidden;user-select:none}
@media(max-width:768px){.graph-wrap{height:480px}}
.graph-canvas{width:100%;height:100%;display:block;cursor:grab}
.graph-canvas.dragging{cursor:grabbing}
.graph-overlay-top{position:absolute;top:12px;left:12px;right:12px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;pointer-events:none;z-index:4}
.graph-pills,.graph-zoom{display:inline-flex;flex-wrap:wrap;gap:4px;background:rgba(13,18,27,0.88);backdrop-filter:blur(8px);padding:4px;border-radius:9px;border:1px solid var(--border-hi);pointer-events:auto}
.g-pill{background:transparent;border:none;color:var(--muted-hi);font-size:.71rem;font-weight:600;padding:4px 9px;border-radius:6px;cursor:pointer;transition:all .14s}
.g-pill:hover{color:var(--text);background:rgba(255,255,255,0.05)}
.g-pill.active{background:var(--surface-3);color:#fff;box-shadow:inset 0 0 0 1px rgba(56,189,248,0.4)}
.graph-legend{position:absolute;bottom:12px;left:12px;display:flex;flex-wrap:wrap;gap:9px;padding:6px 10px;border-radius:8px;background:rgba(13,18,27,0.86);backdrop-filter:blur(8px);border:1px solid var(--border);font-size:.67rem;color:var(--muted-hi);pointer-events:none;z-index:4}
.leg-item{display:inline-flex;align-items:center;gap:5px}
.leg-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.leg-ring{width:9px;height:9px;border-radius:50%;border:1.8px dashed #f59e0b;display:inline-block}
.leg-ring.err{border:1.8px solid #f43f5e}
.graph-tip{position:absolute;pointer-events:none;background:rgba(13,18,27,0.95);border:1px solid var(--border-hi);border-radius:8px;padding:7px 10px;font-size:.72rem;color:var(--text);box-shadow:0 10px 25px rgba(0,0,0,0.55);max-width:290px;display:none;z-index:6}

/* Month View Grid — STRICT minmax(0,1fr) prevents column blowouts! */
.dow-row{display:grid;grid-template-columns:32px repeat(7,minmax(0,1fr));background:var(--surface-2);border-bottom:1px solid var(--border)}
.dow-cell{padding:8px 4px;text-align:center;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted-hi)}
.dow-cell.wknd{color:var(--muted)}
.dow-cell.kw-hdr{font-size:.62rem;color:var(--muted);border-right:1px solid var(--border)}

.month-grid{display:grid;grid-template-columns:32px repeat(7,minmax(0,1fr));grid-auto-rows:minmax(112px,auto)}
@media(max-width:680px){
  .dow-row,.month-grid{grid-template-columns:24px repeat(7,minmax(0,1fr))}
  .month-grid{grid-auto-rows:minmax(92px,auto)}
}
.kw-cell{border-right:1px solid var(--border);border-bottom:1px solid var(--border);background:rgba(15,21,32,0.6);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:7px 2px 4px;font-size:.66rem;font-weight:600;color:var(--muted);cursor:pointer;user-select:none;transition:color .15s,background .15s}
.kw-cell:hover{color:var(--accent);background:rgba(56,189,248,0.07)}

.day{min-width:0;overflow:hidden;border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:6px;display:flex;flex-direction:column;gap:4px;position:relative;background:var(--surface);transition:background .12s ease;cursor:pointer}
.day:nth-child(8n){border-right:none}
.day.wknd{background:rgba(255,255,255,0.01)}
.day.other{background:rgba(7,10,15,0.65)}
.day.other .dnum-txt,.day.other .pill{opacity:.42}
.day:hover{background:var(--surface-2)}
.day.today{background:linear-gradient(180deg,rgba(56,189,248,0.09),rgba(13,18,27,0.95))}
.day.today::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:var(--accent);box-shadow:0 0 10px var(--accent)}

.dhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px;min-width:0}
.dnum-txt{font-size:.76rem;font-weight:600;color:var(--muted-hi);display:inline-flex;align-items:center;gap:4px;line-height:1}
.day.today .dnum-txt{background:var(--accent);color:#041019;font-weight:800;padding:3px 7px;border-radius:99px;box-shadow:0 0 12px rgba(56,189,248,0.45)}
.today-tag{font-size:.58rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--accent)}
.dcount{font-size:.62rem;color:var(--muted);font-weight:600}

/* Event Pills inside Day Cells */
.pill{min-width:0;max-width:100%;overflow:hidden;padding:3.5px 6px;border-radius:5px;border-left:3px solid var(--accent);background:var(--surface-3);color:var(--text);font-size:.71rem;line-height:1.25;display:flex;flex-direction:column;gap:1px;cursor:pointer;transition:transform .1s ease,filter .12s ease}
.pill:hover{filter:brightness(1.15);transform:translateY(-1px)}
.pill-top{display:flex;align-items:center;gap:4px;min-width:0}
.pill-ico{font-size:.68rem;flex-shrink:0;line-height:1}
.pill-time{font-size:.63rem;font-weight:700;opacity:.85;flex-shrink:0}
.pill-txt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word;white-space:normal;font-weight:500;min-width:0;flex:1}
.pill-meta{font-size:.61rem;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.more-pill{font-size:.66rem;font-weight:600;color:var(--accent);padding:2px 5px;border-radius:4px;background:rgba(56,189,248,0.08);text-align:center}

.pill.workout-done{border-left-color:var(--workout);background:var(--workout-bg);color:var(--workout-tx)}
.pill.workout-open{border-left-color:var(--plan);background:var(--plan-bg);color:var(--plan-tx)}
.pill.workout-skipped{border-left-color:#64748b;background:rgba(100,116,139,0.12);color:#94a3b8;text-decoration:line-through}
.pill.goal{border-left-color:var(--goal);background:var(--goal-bg);color:var(--goal-tx);font-weight:600}
.pill.blocked{border-left-color:var(--blocked);background:var(--blocked-bg);color:var(--blocked-tx)}
.pill.event{border-left-color:var(--event);background:var(--event-bg);color:var(--event-tx)}
.pill.deadline{border-left-color:var(--deadline);background:var(--deadline-bg);color:var(--deadline-tx)}
.pill.todo{border-left-color:var(--todo);background:var(--todo-bg);color:var(--todo-tx)}
.pill.todo-done{border-left-color:#10b981;background:rgba(16,185,129,0.09);color:#94a3b8;text-decoration:line-through}
.pill.birthday{border-left-color:var(--bday);background:var(--bday-bg);color:var(--bday-tx)}

/* Week View */
.week-list{display:flex;flex-direction:column}
.wday-row{display:grid;grid-template-columns:130px minmax(0,1fr);border-bottom:1px solid var(--border);min-height:76px;transition:background .12s}
.wday-row:last-child{border-bottom:none}
.wday-row:hover{background:rgba(255,255,255,0.015)}
.wday-row.today{background:linear-gradient(90deg,rgba(56,189,248,0.09),transparent)}
@media(max-width:600px){.wday-row{grid-template-columns:92px minmax(0,1fr)}}
.wday-left{padding:12px;border-right:1px solid var(--border);display:flex;flex-direction:column;gap:2px}
.wday-dow{font-size:.72rem;font-weight:700;text-transform:uppercase;color:var(--muted-hi)}
.wday-date{font-size:1.05rem;font-weight:800;color:var(--text)}
.wday-row.today .wday-date{color:var(--accent)}
.wday-right{padding:10px 12px;display:flex;flex-direction:column;gap:7px;justify-content:center;min-width:0}
.wday-empty{font-size:.76rem;color:var(--muted);font-style:italic}

/* Agenda View */
.agenda-view{padding:14px;display:flex;flex-direction:column;gap:16px}
.ag-group{display:flex;flex-direction:column;gap:7px}
.ag-month-hdr{font-size:.76rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);padding-bottom:4px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between}
.ag-item{display:grid;grid-template-columns:105px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;cursor:pointer;transition:border-color .15s,background .15s}
.ag-item:hover{border-color:var(--border-hi);background:var(--surface-3)}
@media(max-width:600px){.ag-item{grid-template-columns:82px minmax(0,1fr)}}
.ag-date-col{display:flex;flex-direction:column}
.ag-date-main{font-size:.8rem;font-weight:700;color:var(--text)}
.ag-date-sub{font-size:.68rem;color:var(--muted-hi)}

/* Sidebar */
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 6px 20px rgba(0,0,0,0.25);min-width:0}
.card-hdr{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card-title{font-size:.76rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted-hi);display:flex;align-items:center;gap:6px}
.card-badge{font-size:.68rem;font-weight:600;padding:1px 7px;border-radius:99px;background:var(--surface-3);color:var(--text-dim)}
.list{display:flex;flex-direction:column;gap:7px;max-height:340px;overflow-y:auto;padding-right:2px}
.list::-webkit-scrollbar{width:5px}
.list::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:99px}

.row{font-size:.79rem;padding:9px 11px;border-radius:8px;background:var(--surface-2);border:1px solid var(--border);display:flex;justify-content:space-between;gap:10px;align-items:flex-start;cursor:pointer;transition:border-color .15s,background .15s;min-width:0}
.row:hover{border-color:var(--border-hi);background:var(--surface-3)}
.row-main{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px}
.row-title{font-weight:600;color:var(--text);word-break:break-word;line-height:1.3}
.row-sub{font-size:.7rem;color:var(--muted-hi);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ctx-snip{font-size:.69rem;color:var(--text-dim);background:rgba(7,10,15,0.55);padding:4px 7px;border-radius:5px;border-left:2px solid var(--accent);margin-top:2px;word-break:break-word}
.tag{font-size:.67rem;font-weight:600;padding:2px 7px;border-radius:5px;background:var(--surface-3);color:var(--text-dim);white-space:nowrap;flex-shrink:0}
.tag.high,.tag.overdue{background:rgba(244,63,94,0.18);color:#fda4af;border:1px solid rgba(244,63,94,0.3)}
.tag.med{background:rgba(249,115,22,0.16);color:#fdba74;border:1px solid rgba(249,115,22,0.3)}
.tag.low{background:rgba(56,189,248,0.14);color:#bae6fd}
.tag.goal{background:rgba(245,158,11,0.18);color:#fde68a;border:1px solid rgba(245,158,11,0.3)}
.tag.ok{background:rgba(16,185,129,0.16);color:#6ee7b7;border:1px solid rgba(16,185,129,0.3)}
.empty-box{font-size:.78rem;color:var(--muted-hi);padding:12px;border-radius:8px;background:rgba(255,255,255,0.02);border:1px dashed var(--border);display:flex;flex-direction:column;gap:6px}
.code-hint{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.7rem;background:var(--bg);padding:5px 8px;border-radius:5px;color:var(--accent);border:1px solid var(--border);cursor:pointer;word-break:break-all}

/* Toast Notification */
.toast{position:fixed;bottom:18px;right:18px;background:rgba(13,18,27,0.96);border:1px solid var(--border-hi);color:var(--text);padding:10px 14px;border-radius:10px;font-size:.78rem;box-shadow:0 14px 36px rgba(0,0,0,0.55);display:none;align-items:center;gap:8px;z-index:120;max-width:420px}
.toast.show{display:flex}
.toast.err{border-color:rgba(244,63,94,0.5);color:#fecdd3}
.toast.ok{border-color:rgba(16,185,129,0.45);color:#a7f3d0}

/* Modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(3,6,12,0.75);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:16px;z-index:100}
.modal-backdrop.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border-hi);border-radius:14px;max-width:560px;width:100%;padding:20px;box-shadow:0 24px 60px rgba(0,0,0,0.65);display:flex;flex-direction:column;gap:14px}
.modal-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.modal-title{font-size:1.05rem;font-weight:700;color:var(--text);line-height:1.35}
.modal-close{background:var(--surface-2);border:1px solid var(--border);color:var(--muted-hi);width:28px;height:28px;border-radius:7px;cursor:pointer;font-size:.9rem}
.modal-close:hover{color:#fff;background:var(--surface-3)}
.modal-meta{display:flex;flex-wrap:wrap;gap:8px}
.modal-body{font-size:.84rem;color:var(--text-dim);background:var(--surface-2);padding:12px;border-radius:9px;border:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
.modal-actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px}
.btn-act{background:var(--surface-3);color:var(--text);border:1px solid var(--border-hi);padding:6px 12px;border-radius:7px;font-size:.76rem;font-weight:600;cursor:pointer}
.btn-act:hover{border-color:var(--accent);color:var(--accent)}
</style></head><body>
<div class="shell">
  <header class="topbar">
    <div class="brand">
      <div class="brand-icon" id="brand-ico">📅</div>
      <div>
        <div class="brand-title">Atlas · Calendar, Coach &amp; Brain Hub</div>
        <div class="brand-sub">
          <span class="live-pill"><span class="live-dot"></span>Atlas-First · Live</span>
          <span id="today-sub"></span>
        </div>
      </div>
    </div>
    <div class="toolbar">
      <div class="seg" role="tablist">
        <button id="f-all" class="active" onclick="setFilter('all')">Alle <span class="cnt" id="cnt-all">0</span></button>
        <button id="f-coach" onclick="setFilter('coach')">🚴 Coach View <span class="cnt" id="cnt-coach">0</span></button>
        <button id="f-todo" onclick="setFilter('todo')">☑️ To-Dos &amp; Fristen <span class="cnt" id="cnt-todo">0</span></button>

        <span class="nav-label" id="mlabel" onclick="goToday()" title="Springe zu Heute (T)"></span>
        <button class="nav-btn" onclick="stepNav(1)" title="Vor (▶)">▶</button>

  <section id="coach-ribbon" class="coach-ribbon"></section>

    <aside class="side">
      <div class="card"><div class="card-hdr"><div class="card-title" id="s1-title"></div><span class="card-badge" id="s1-cnt"></span></div><div class="list" id="s1-list"></div></div>
      <div class="card"><div class="card-hdr"><div class="card-title" id="s2-title"></div><span class="card-badge" id="s2-cnt"></span></div><div class="list" id="s2-list"></div></div>
      <div class="card"><div class="card-hdr"><div class="card-title" id="s3-title"></div><span class="card-badge" id="s3-cnt"></span></div><div class="list" id="s3-list"></div></div>
    </aside>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-backdrop" id="modal-bg" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-top">
      <div class="modal-title" id="m-title"></div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-meta" id="m-meta"></div>
    <div class="modal-body" id="m-body"></div>
    <div class="modal-actions">
      <button class="btn-act" id="m-toggle" style="display:none"></button>
      <button class="btn-act" id="m-copy">📋 Quelle / Markdown kopieren</button>
      <button class="btn-act" onclick="closeModal()">Schließen</button>
    </div>
  </div>
</div>

<script>
let DATA = __DATA_JSON__;
const MONTHS = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const MONTHS_SHORT = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const DOWS = ['Mo','Di','Mi','Do','Fr','Sa','So'];
const DOMAIN_COLORS = {
  people:'#ec4899', areas:'#38bdf8', projects:'#8b5cf6', howto:'#f59e0b',
  self:'#10b981', coach:'#14b8a6', calendar:'#f97316', journal:'#94a3b8',
  inbox:'#eab308', skills:'#a855f7', root:'#6366f1', other:'#64748b'
};

let cur = new Date(DATA.today + "T00:00:00");
const _urlView = new URLSearchParams(window.location.search).get("view");
if(_urlView && ["all","coach","todo","graph"].includes(_urlView)) sessionStorage.setItem("atlas_cal_filter", _urlView);
let filter = sessionStorage.getItem("atlas_cal_filter") || "all";
if(!["all","coach","todo","graph"].includes(filter)) filter = "all";
let layout = sessionStorage.getItem("atlas_cal_layout") || "month";
let query = "";
let pcurveTab = "epochs"; // 'epochs' | 'durability'

// Brain Graph state
let graphDomainFilter = "all"; // 'all'|'people'|'areas'|'projects'|'howto'|'isolated'|'stale'
let graphShowHubs = sessionStorage.getItem("atlas_graph_hubs") === "1";
let graphShowJournals = false;
if(sessionStorage.getItem("atlas_graph_journals") === "1") graphShowJournals = true;
let graphSelectedRel = null;
let graphHoverRel = null;
let graphSim = { nodes: [], edges: [], byRel: {}, camX: 0, camY: 0, scale: 1, ticks: 0, raf: 0, key: "", dragNode: null, panning: false, lastX: 0, lastY: 0, moved: false, autoFit: true };
let _toastTimer = null;

function showToast(msg, kind='ok'){
  const el = document.getElementById('toast');
  if(!el) return;
  el.textContent = msg;
  el.className = 'toast show ' + kind;
  if(_toastTimer) clearTimeout(_toastTimer);
  _toastTimer = setTimeout(()=>{ el.classList.remove('show'); }, 3200);
}

function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseIso(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function getKW(d){
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(t.getUTCFullYear(),0,1));
  return Math.ceil((((t - yearStart) / 86400000) + 1)/7);
}
function fmtDateDE(s){
  const [y,m,d] = String(s||'').split('-');
  return d ? `${d}.${m}.${y}` : String(s||'');
}
function esc(s){
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function compactTitle(what){
  let s = String(what||'');
  const mAmt = s.match(/(\d[\d.,]*\s*€(?:\s*\/\s*(?:Monat|M|Jahr|J|Quartal))?)/);
  let main = s.replace(/\s*\((?:Eingang|doppeltes|übergesetzliche|30 Tage|seit \d+|je \d+).*?\)/gi, '').trim();
  if(main.length > 68 && main.includes('(')) main = main.split('(')[0].trim();
  return {main: main || s, meta: mAmt ? mAmt[1] : ''};
}
function coachMode(){
  const c = DATA.coach || {};
  const d = String(c.depth || 'standard').toLowerCase();
  if(d === 'simple') return 'simple';
  const tel = c.telemetry || {};
  if(d === 'pro' || (tel.cp_model && tel.cp_model.valid) || (tel.cs_model && tel.cs_model.valid) || (tel.pmc && (tel.pmc.ctl > 0 || tel.pmc.weekly_load_7d > 0))) return 'pro';
  return 'standard';
}
function isCoachItem(it){
  return ['workout','blocked','goal'].includes(it.kind) || (it.kind==='event' && Boolean(it.time));
}
function isTodoItem(it){
  return ['todo','deadline'].includes(it.kind);
}
function keepItem(it){
  if(filter==='coach' && !isCoachItem(it)) return false;
  if(filter==='todo' && !isTodoItem(it)) return false;
  if(query){
    const q = query.toLowerCase();
    const hay = `${it.what} ${it.kind} ${it.subkind||''} ${it.rel||''} ${it.start}`.toLowerCase();
    if(!hay.includes(q)) return false;
  }
  return true;
}
function pillClass(it){
  if(it.kind==='workout') return 'pill workout-' + it.status;
  if(it.kind==='todo' && it.status==='done') return 'pill todo-done';
  return 'pill ' + it.kind;
}
function icon(it){
  if(it.kind==='workout') return (it.status==='done'?'✓':it.status==='skipped'?'–':(it.subkind==='strength'?'🏋️':it.subkind==='running'?'🏃':'🚴'));
  if(it.kind==='goal') return '🏆';
  if(it.kind==='blocked') return '🚫';
  if(it.kind==='birthday') return (it.subkind==='anniversary'?'❤️':'🎂');
  if(it.kind==='deadline') return '⏳';
  if(it.kind==='todo') return (it.status==='done'?'✅':'☑️');
  return '📅';
}
function deltaLabel(delta){
  if(delta===0) return 'heute';
  if(delta===1) return 'morgen';
  if(delta===-1) return 'gestern';
  return delta < 0 ? `vor ${-delta}d` : `in ${delta}d`;
}
function setFilter(f){
  filter = f;
  sessionStorage.setItem("atlas_cal_filter", f);
  const url = new URL(window.location.href);
  if(f === 'all') url.searchParams.delete('view');
  else url.searchParams.set('view', f);
  try { window.history.replaceState({}, '', url.toString()); } catch(_e){}
  render();
}
function setLayout(l){
  layout = l;
  sessionStorage.setItem("atlas_cal_layout", l);
  render();
}
function setQuery(q){
  query = (q||'').trim();
  if(filter === 'graph'){
    graphSim.key = '';
    renderKPIs();
    renderGraphMain();
    renderSidebar();
  } else {
    render();
  }
}
function setPcurveTab(t){
  pcurveTab = t;
  renderSidebar();
}
function stepNav(dir){
  if(filter==='graph') return;
  if(layout==='week'){
    cur = new Date(cur.getFullYear(), cur.getMonth(), cur.getDate() + dir*7);
  } else {
    cur = new Date(cur.getFullYear(), cur.getMonth() + dir, 1);
  }
  render();
}
function goToday(){
  cur = new Date(DATA.today + "T00:00:00");
  render();
}
function openWeekOf(dateStr){
  cur = parseIso(dateStr);
  setLayout('week');
}
function zoneColor(z){
  if(z<=1) return '#64748b';
  if(z===2) return '#38bdf8';
  if(z===3) return '#10b981';
  if(z===4) return '#f59e0b';
  if(z===5) return '#f43f5e';
  return '#a855f7';
}
function renderWkoBars(it, tall=false){
  if(coachMode()==='simple') return '';
  const blks = it.visual_blocks || [];
  if(!blks.length) return '';
  const tot = blks.reduce((s,b)=>s+(b.sec||60), 0) || 1;
  const h = tall ? 28 : 11;
  return `<div class="wko-bars" style="height:${h}px" title="Intervall-Struktur (${it.total_min||0} min)">` +
    blks.map(b => {
      const wPct = Math.max(2, (b.sec/tot)*100);
      const hPct = Math.min(100, Math.max(22, Math.round((b.pct||0.65)*78)));
      return `<div class="wko-bar" style="width:${wPct.toFixed(1)}%;height:${hPct}%;background:${zoneColor(b.zone||2)}" title="${esc(b.label||'Block')}"></div>`;
    }).join('') + `</div>`;
}
function downloadZwo(idx){
  const it = DATA.items[idx];
  if(!it || !it.zwo_xml) return;
  const blob = new Blob([it.zwo_xml], {type: 'application/xml'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = it.zwo_filename || `${it.start}_workout.zwo`;
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); }, 150);
}
function kwPhaseMap(){
  const m = (DATA.coach && DATA.coach.macro && DATA.coach.macro.weeks) || [];
  const out = {};
  for(const w of m){ out[String(w.kw).replace(/^0+/,'')] = w; }
  return out;
}

/* ---------------- CSRF-Protected /toggle-todo ---------------- */
async function postToggleTodo(reqPayload){
  const res = await fetch('/toggle-todo', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'X-Atlas-CSRF': DATA.csrf_token || ''
    },
    body: JSON.stringify(Object.assign({}, reqPayload, {csrf_token: DATA.csrf_token || ''}))
  });
  let body = {};
  try { body = await res.json(); } catch(_e){}
  if(!res.ok || !body.ok){
    throw new Error(body.error || `HTTP ${res.status}`);
  }
  return body;
}

async function toggleDatedItem(idx, ev){
  if(ev) ev.stopPropagation();
  const it = DATA.items[idx];
  if(!it || !it.can_toggle) return;
  const prevStatus = it.status;
  const wantDone = prevStatus !== 'done';
  it.status = wantDone ? 'done' : 'open';
  render();
  try {
    const out = await postToggleTodo({rel: it.rel, line: it.line, what: it.what, done: wantDone});
    it.status = out.done ? 'done' : 'open';
    showToast(`${out.done ? '✓ Erledigt' : '↺ Wieder offen'}: ${it.what.slice(0, 48)} (${out.rel})`, 'ok');
    render();
  } catch(err){
    it.status = prevStatus;
    render();
    showToast(`Offline / Schreibschutz (${err.message}) — bitte über den lokalen Atlas-Server öffnen.`, 'err');
  }
}

async function toggleUndatedTodo(tIdx, ev){
  if(ev) ev.stopPropagation();
  const td = DATA.todos[tIdx];
  if(!td || !td.can_toggle) return;
  const prevStatus = td.status;
  const wantDone = prevStatus !== 'done';
  td.status = wantDone ? 'done' : 'open';
  render();
  try {
    const out = await postToggleTodo({rel: td.rel, line: td.line, what: td.what, done: wantDone});
    if(out.done){
      DATA.todos.splice(tIdx, 1);
    } else {
      td.status = 'open';
    }
    showToast(`${out.done ? '✓ To-Do abgehakt' : '↺ Wieder offen'}: ${td.what.slice(0, 48)} (${out.rel})`, 'ok');
    render();
  } catch(err){
    td.status = prevStatus;
    render();
    showToast(`Offline / Schreibschutz (${err.message}) — bitte über den lokalen Atlas-Server öffnen.`, 'err');
  }
}

function showItemModal(idx){
  const it = DATA.items[idx];
  if(!it) return;
  const bg = document.getElementById('modal-bg');
  document.getElementById('m-title').textContent = `${icon(it)} ${it.what}`;
  const kw = getKW(parseIso(it.start));
  const kindLbl = it.subkind ? `${it.kind.toUpperCase()} · ${it.subkind.toUpperCase()}` : it.kind.toUpperCase();
  const mode = coachMode();
  document.getElementById('m-meta').innerHTML = `
    <span class="tag goal">${esc(kindLbl)}</span>
    <span class="tag">${esc(fmtDateDE(it.start))}${it.end!==it.start?' – '+esc(fmtDateDE(it.end)):''} · KW ${kw}</span>
    ${it.time?`<span class="tag">🕒 ${esc(it.time)}</span>`:''}
    <span class="tag ${it.delta<0 && it.status!=='done'?'overdue':'ok'}">${esc(deltaLabel(it.delta))} (${(it.delta/7).toFixed(1)}w)</span>
    ${mode!=='simple' && it.np_w?`<span class="tag ok">⚡ NP ${it.np_w} W</span>`:''}
    ${mode!=='simple' && it.avg_hr?`<span class="tag">❤️ ${it.avg_hr} bpm</span>`:''}
    ${mode!=='simple' && it.tss?`<span class="tag low">📈 TSS ${Math.round(it.tss)}</span>`:''}
    ${mode!=='simple' && it.w_bal_min_pct!=null?`<span class="tag ${it.w_bal_min_pct<25?'med':'ok'}">🔋 W'bal min ${Math.round(it.w_bal_min_pct)}%</span>`:''}
    ${mode!=='simple' && it.matches_burned?`<span class="tag med">🔥 ${it.matches_burned} Match(es)</span>`:''}
    ${mode!=='simple' && it.cho_burn_g?`<span class="tag">🍌 ${Math.round(it.cho_burn_g)}g CHO</span>`:''}
  `;
  let extra = '';
  if(mode!=='simple' && it.visual_blocks && it.visual_blocks.length){
    extra += `<div><strong>Intervall-Struktur (${it.total_min||0} min):</strong>${renderWkoBars(it, true)}</div>`;
  }
  if(it.feedback){
    extra += `<div><strong>Athleten-Feedback:</strong><br><span style="color:#6ee7b7">${esc(it.feedback)}</span></div>`;
  } else if(mode!=='simple' && it.feedback_pending){
    extra += `<div style="color:#fde68a"><strong>⚠ Check-in offen:</strong> Noch keine subjektive Notiz (RPE / Beine) hinterlegt.<br><code>atlas.py coach note --date ${esc(it.start)} --text "..."</code></div>`;
  }
  if(mode!=='simple' && it.zwo_xml){
    extra += `<div style="margin-top:4px"><button class="btn-act" style="border-color:var(--workout);color:#6ee7b7" onclick="downloadZwo(${idx})">⬇ .zwo Workout herunterladen (${esc(it.zwo_filename||'workout.zwo')})</button></div>`;
  }
  document.getElementById('m-body').innerHTML = `
    <div><strong>Beschreibung:</strong><br>${esc(it.what)}</div>
    ${extra}
    <div style="color:var(--muted-hi);font-size:.76rem"><strong>Quelle im Brain:</strong> <code>${esc(it.rel)}${it.line?':'+it.line:''}</code></div>
  `;
  const tglBtn = document.getElementById('m-toggle');
  if(it.can_toggle){
    tglBtn.style.display = 'inline-block';
    tglBtn.textContent = it.status==='done' ? '↺ Wieder als offen markieren' : '✓ Als erledigt abhaken';
    tglBtn.style.borderColor = it.status==='done' ? 'var(--border-hi)' : 'var(--workout)';
    tglBtn.style.color = it.status==='done' ? 'var(--text)' : '#6ee7b7';

/* ---------------- SVG 42d PMC Sparkline ---------------- */
function renderPmcSparkline(series){
  if(!series || series.length < 2) return '';
  const w = 180, h = 36, pad = 3;
  const vals = [];
  for(const pt of series){ vals.push(pt.ctl||0, pt.atl||0); }
  const minV = Math.min(0, ...vals);
  const maxV = Math.max(20, ...vals);
  const span = (maxV - minV) || 1;
  const xAt = i => (pad + (i / (series.length - 1)) * (w - pad*2)).toFixed(1);
  const yAt = v => (h - pad - ((v - minV) / span) * (h - pad*2)).toFixed(1);
  const ctlPts = series.map((p,i)=>`${xAt(i)},${yAt(p.ctl||0)}`).join(' ');
  const atlPts = series.map((p,i)=>`${xAt(i)},${yAt(p.atl||0)}`).join(' ');
  return `<svg class="pmc-spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-label="42d CTL ATL Trend">
    <polyline fill="none" stroke="rgba(244,63,94,0.65)" stroke-width="1.4" points="${atlPts}"/>
    <polyline fill="none" stroke="#38bdf8" stroke-width="2" points="${ctlPts}"/>
  </svg>`;
}

        <div class="kpi-sub">${nxt ? `Als Nächstes: in ${nxt.delta}d (${fmtDateDE(nxt.start)})` : 'Freier Horizont'}</div>
      </div>
      <div class="kpi" style="--kpi-color:var(--todo)">
        <div class="kpi-lbl"><span>☑️ To-Do Backlog</span><span>Offen</span></div>
        <div class="kpi-val">${DATA.todos.length} Aufgaben</div>
        <div class="kpi-sub">${DATA.todos[0] ? esc(DATA.todos[0].what) : 'Keine offenen Backlog-To-Dos'}</div>
      </div>
      <div class="kpi" style="--kpi-color:var(--bday)">
        <div class="kpi-lbl"><span>🎂 Geburtstage &amp; Ziele</span><span>365 Tage</span></div>
        <div class="kpi-val">${bdays.length} Ehrentage</div>
        <div class="kpi-sub">${bdays[0] ? `${esc(bdays[0].what)} (in ${bdays[0].delta}d)` : 'Alle Jahrestage synchronisiert'}</div>
      </div>
    `;
  }
}

/* ---------------- Interactive Brain Graph Engine (Canvas 2D) ---------------- */
const GRAPH_COOLING_TICKS = 260;

function setGraphDomain(dom){
  graphDomainFilter = dom;
  graphSim.key = '';
  graphSim.autoFit = true;
  renderGraphMain();
  renderSidebar();
}
function toggleGraphHubs(){
  graphShowHubs = !graphShowHubs;
  try { sessionStorage.setItem("atlas_graph_hubs", graphShowHubs ? "1" : "0"); } catch(_e){}
  graphSim.key = '';
  graphSim.autoFit = true;
  renderGraphMain();
  renderSidebar();
}
function toggleGraphJournals(){
  graphShowJournals = !graphShowJournals;
  try { sessionStorage.setItem("atlas_graph_journals", graphShowJournals ? "1" : "0"); } catch(_e){}
  graphSim.key = '';
  graphSim.autoFit = true;
  renderKPIs();
  renderGraphMain();
  renderSidebar();
}
function zoomGraph(factor){
  graphSim.autoFit = false;
  graphSim.scale = Math.min(4.0, Math.max(0.18, graphSim.scale * factor));
  drawGraphFrame();
}
function fitGraphToViewport(padding = 60){
  const canvas = document.getElementById('graph-canvas');
  const nodes = graphSim.nodes;
  if(!canvas || !nodes.length){
    graphSim.camX = 0;
    graphSim.camY = 0;
    graphSim.scale = 1;
    return;
  }
  const rect = canvas.getBoundingClientRect();
  const w = Math.max(320, rect.width || 900);
  const h = Math.max(300, rect.height || 640);
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for(const n of nodes){
    const m = n.r + 18;
    if(n.x - m < minX) minX = n.x - m;
    if(n.x + m > maxX) maxX = n.x + m;
    if(n.y - m < minY) minY = n.y - m;
    if(n.y + m > maxY) maxY = n.y + m;
  }
  const spanX = Math.max(140, maxX - minX);
  const spanY = Math.max(140, maxY - minY);
  const availW = Math.max(160, w - padding * 2);
  const availH = Math.max(160, h - padding * 2 - 36);
  const fitScale = Math.min(availW / spanX, availH / spanY);
  graphSim.scale = Math.min(1.6, Math.max(0.18, fitScale));
  const midX = (minX + maxX) / 2;
  const midY = (minY + maxY) / 2;
  graphSim.camX = -midX * graphSim.scale;
  graphSim.camY = -midY * graphSim.scale + 8;
}
function resetGraphCamera(){
  graphSim.autoFit = true;
  fitGraphToViewport(60);
  drawGraphFrame();
}
function selectGraphNode(rel, center=false){
  if(rel){
    const g = DATA.graph || {nodes:[]};
    const targetNode = g.nodes.find(n => n.rel === rel);
    if(targetNode && ((targetNode.domain === 'journal' && !graphShowJournals) || (targetNode.is_hub && !graphShowHubs)) && !graphSim.byRel[rel]){
      graphSelectedRel = rel;
      graphSim.key = '';
      rebuildGraphSimulation();
    }
  }
  graphSelectedRel = rel;
  if(center && rel && graphSim.byRel[rel]){
    graphSim.autoFit = false;
    graphSim.camX = -graphSim.byRel[rel].x * graphSim.scale;
    graphSim.camY = -graphSim.byRel[rel].y * graphSim.scale;
  }
  drawGraphFrame();
  renderSidebar();
}

function filteredGraphData(){
  const g = DATA.graph || {nodes:[], edges:[]};
  const q = query.toLowerCase();
  const nodes = g.nodes.filter(n => {
    if(!graphShowJournals && n.domain === 'journal' && n.rel !== graphSelectedRel) return false;
    if(!graphShowHubs && n.is_hub && n.rel !== graphSelectedRel){
      if(graphDomainFilter !== 'all' || g.nodes.length > 8) return false;
    }
    if(graphDomainFilter === 'isolated' && !n.isolated) return false;
    if(graphDomainFilter === 'stale' && !(n.stale_verified || n.expired_valid_until || (n.broken_links && n.broken_links.length))) return false;
    if(['people','areas','projects','howto'].includes(graphDomainFilter) && n.domain !== graphDomainFilter) return false;
    if(q){
      const hay = `${n.title} ${n.rel} ${n.summary||''} ${(n.tags||[]).join(' ')}`.toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  const keep = new Set(nodes.map(n => n.rel));
  const edges = g.edges.filter(e => {
    if(!keep.has(e.src) || !keep.has(e.dst)) return false;
    if(!graphShowJournals && e.kind === 'journal') return false;
    if(!graphShowHubs && e.kind === 'tree') return false;
    return true;
  });
  return {nodes, edges};
}

function rebuildGraphSimulation(){
  const {nodes, edges} = filteredGraphData();
  const sig = `${graphDomainFilter}|${graphShowHubs}|${graphShowJournals}|${query}|${nodes.length}|${edges.length}`;
  if(graphSim.key === sig && graphSim.nodes.length === nodes.length) return;
  const oldPos = graphSim.byRel || {};
  const domOrder = ['self','people','areas','projects','howto','coach','calendar','journal','inbox','skills','root','other'];
  const presentDoms = domOrder.filter(d => nodes.some(n => n.domain === d));
  if(!presentDoms.length) presentDoms.push('other');
  const N = Math.max(1, nodes.length);
  const clusterRadius = presentDoms.length <= 1 ? 0 : Math.max(160, Math.sqrt(N) * 32);
  const domAnchors = {};
  presentDoms.forEach((d, i) => {
    const ang = (i / presentDoms.length) * Math.PI * 2 - Math.PI / 2;
    domAnchors[d] = {
      x: Math.cos(ang) * clusterRadius,
      y: Math.sin(ang) * clusterRadius
    };
  });

  const simNodes = nodes.map((n, idx) => {
    const prev = oldPos[n.rel];
    const anc = domAnchors[n.domain] || {x: 0, y: 0};
    const localAngle = idx * 2.399963229728653; // golden angle
    const localSpread = 28 + Math.sqrt(idx + 1) * 26;
    const deg = n.degree || 0;
    const radius = Math.min(14.5, Math.max(5.5, 5.5 + Math.log2(deg + 1) * 2.1));
    return {
      data: n,
      rel: n.rel,
      r: radius,
      ax: anc.x,
      ay: anc.y,
      x: prev ? prev.x : anc.x + Math.cos(localAngle) * localSpread,
      y: prev ? prev.y : anc.y + Math.sin(localAngle) * localSpread,
      vx: 0, vy: 0
    };
  });
  const byRel = {};
  for(const sn of simNodes) byRel[sn.rel] = sn;
  const simEdges = edges.map(e => ({
    src: byRel[e.src],
    dst: byRel[e.dst],
    kind: e.kind,
    anchor: e.anchor
  })).filter(e => e.src && e.dst);

  graphSim.nodes = simNodes;
  graphSim.edges = simEdges;
  graphSim.byRel = byRel;
  graphSim.key = sig;
  graphSim.ticks = 0;
  graphSim.autoFit = true;

  // Pre-warm ~200 cooling ticks synchronously (~3ms) so initial render is immediately airy & untangled
  const preWarm = Math.min(200, GRAPH_COOLING_TICKS - 60);
  for(let t = 0; t < preWarm; t++){
    const alpha = Math.max(0.06, 1 - t / GRAPH_COOLING_TICKS);
    stepGraphPhysics(alpha);
    graphSim.ticks++;
  }
}

function stepGraphPhysics(alpha = 1){
  const nodes = graphSim.nodes;
  const edges = graphSim.edges;
  const N = nodes.length;
  if(N <= 1) return;

  const repulse = N > 150 ? 6800 : 8800;
  for(let i = 0; i < N; i++){
    const a = nodes[i];
    for(let j = i + 1; j < N; j++){
      const b = nodes[j];
      let dx = b.x - a.x, dy = b.y - a.y;
      let d2 = dx * dx + dy * dy;
      if(d2 < 4){ dx = (i % 2 ? 1 : -1) * 2; dy = (j % 2 ? 1 : -1) * 2; d2 = 8; }
      if(d2 > 520000) continue;
      const d = Math.sqrt(d2);
      const sameDom = a.data.domain === b.data.domain ? 0.82 : 1.05;
      const f = ((repulse * sameDom) / d2) * alpha;
      const fx = (dx / d) * f, fy = (dy / d) * f;
      if(a !== graphSim.dragNode){ a.vx -= fx; a.vy -= fy; }
      if(b !== graphSim.dragNode){ b.vx += fx; b.vy += fy; }
    }
  }

  for(const e of edges){
    const a = e.src, b = e.dst;
    const dx = b.x - a.x, dy = b.y - a.y;
    const d = Math.sqrt(dx * dx + dy * dy) || 1;
    const targetLen = e.kind === 'related' ? 145 : (e.kind === 'body' ? 170 : (e.kind === 'journal' ? 195 : 160));
    const k = (e.kind === 'related' ? 0.038 : (e.kind === 'body' ? 0.026 : 0.016)) * alpha;
    const f = (d - targetLen) * k;
    const fx = (dx / d) * f, fy = (dy / d) * f;
    if(a !== graphSim.dragNode){ a.vx += fx; a.vy += fy; }
    if(b !== graphSim.dragNode){ b.vx -= fx; b.vy -= fy; }
  }

  for(const n of nodes){
    if(n === graphSim.dragNode) continue;
    // Gentle domain-sector ring pull + very soft global centering
    n.vx += ((n.ax || 0) - n.x) * 0.0065 * alpha;
    n.vy += ((n.ay || 0) - n.y) * 0.0065 * alpha;
    n.vx -= n.x * 0.0018 * alpha;
    n.vy -= n.y * 0.0018 * alpha;
    n.vx *= 0.76;
    n.vy *= 0.76;
    const stepLim = 18;
    n.x += Math.max(-stepLim, Math.min(stepLim, n.vx));
    n.y += Math.max(-stepLim, Math.min(stepLim, n.vy));
  }

  // Hard circle-collision separation pass so nodes NEVER overlap or clump
  for(let pass = 0; pass < 2; pass++){
    for(let i = 0; i < N; i++){
      const a = nodes[i];
      for(let j = i + 1; j < N; j++){
        const b = nodes[j];
        let dx = b.x - a.x, dy = b.y - a.y;
        let d2 = dx * dx + dy * dy;
        const minDist = a.r + b.r + 22;
        if(d2 < minDist * minDist){
          if(d2 < 0.01){
            const ang = ((i * 7 + j * 13) % 360) * (Math.PI / 180);
            dx = Math.cos(ang);
            dy = Math.sin(ang);
            d2 = 1;
          }
          const d = Math.sqrt(d2);
          const overlap = (minDist - d) * 0.5;
          const ux = dx / d, uy = dy / d;
          if(a === graphSim.dragNode){
            b.x += ux * overlap * 2;
            b.y += uy * overlap * 2;
          } else if(b === graphSim.dragNode){
            a.x -= ux * overlap * 2;
            a.y -= uy * overlap * 2;
          } else {
            a.x -= ux * overlap;
            a.y -= uy * overlap;
          }
        }
      }
    }
  }
}

function _rectsIntersect(a, b){
  return !(a.x2 <= b.x1 || a.x1 >= b.x2 || a.y2 <= b.y1 || a.y1 >= b.y2);
}

function _fillRoundedPill(ctx, x, y, w, h, r){
  const rad = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rad, y);
  ctx.lineTo(x + w - rad, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + rad);
  ctx.lineTo(x + w, y + h - rad);
  ctx.quadraticCurveTo(x + w, y + h, x + w - rad, y + h);
  ctx.lineTo(x + rad, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - rad);
  ctx.lineTo(x, y + rad);
  ctx.quadraticCurveTo(x, y, x + rad, y);
  ctx.closePath();
  ctx.fill();
}

function drawGraphFrame(){
  const canvas = document.getElementById('graph-canvas');
  if(!canvas) return;
  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  const w = Math.max(300, Math.floor(rect.width));
  const h = Math.max(300, Math.floor(rect.height));
  if(canvas.width !== Math.floor(w * dpr) || canvas.height !== Math.floor(h * dpr)){
    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
  }
  const ctx = canvas.getContext('2d');
  ctx.save();
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);

  const cx = w / 2 + graphSim.camX;
  const cy = h / 2 + graphSim.camY;
  const scale = graphSim.scale;

  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(scale, scale);

  const focusRel = graphHoverRel || graphSelectedRel;
  const focusNeighbors = new Set();
  if(focusRel){
    focusNeighbors.add(focusRel);
    for(const e of graphSim.edges){
      if(e.src.rel === focusRel) focusNeighbors.add(e.dst.rel);
      if(e.dst.rel === focusRel) focusNeighbors.add(e.src.rel);
    }
  }

  // 1. Draw edges (world space)
  for(const e of graphSim.edges){
    const active = focusRel && (e.src.rel === focusRel || e.dst.rel === focusRel);
    const dim = focusRel && !active;
    ctx.beginPath();
    if(e.kind === 'journal') ctx.setLineDash([4, 4]);
    else if(e.kind === 'tree') ctx.setLineDash([2, 4]);
    else ctx.setLineDash([]);
    ctx.lineWidth = (active ? 2.0 : (e.kind === 'related' ? 1.35 : 0.95)) / Math.pow(scale, 0.35);
    ctx.strokeStyle = active
      ? 'rgba(56,189,248,0.88)'
      : (dim ? 'rgba(148,163,184,0.06)' : (e.kind === 'related' ? 'rgba(56,189,248,0.32)' : 'rgba(148,163,184,0.20)'));
    ctx.moveTo(e.src.x, e.src.y);
    ctx.lineTo(e.dst.x, e.dst.y);
    ctx.stroke();
  }
  ctx.setLineDash([]);

  // 2. Draw node circles & warning rings (world space)
  for(const n of graphSim.nodes){
    const d = n.data;
    const isSel = n.rel === graphSelectedRel;
    const isHov = n.rel === graphHoverRel;
    const dim = focusRel && !focusNeighbors.has(n.rel);
    const col = DOMAIN_COLORS[d.domain] || DOMAIN_COLORS.other;

    // Warning rings (broken links -> rose, stale verified / expired valid_until -> dashed amber, isolated -> dotted sky)
    if(d.broken_links && d.broken_links.length){
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r + 4.5, 0, Math.PI*2);
      ctx.strokeStyle = dim ? 'rgba(244,63,94,0.25)' : '#f43f5e';
      ctx.lineWidth = 2;
      ctx.stroke();
    } else if(d.stale_verified || d.expired_valid_until){
      ctx.beginPath();
      ctx.setLineDash([3.5, 2.5]);
      ctx.arc(n.x, n.y, n.r + 4.2, 0, Math.PI*2);
      ctx.strokeStyle = dim ? 'rgba(245,158,11,0.25)' : '#f59e0b';
      ctx.lineWidth = 1.8;
      ctx.stroke();
      ctx.setLineDash([]);
    } else if(d.isolated){
      ctx.beginPath();
      ctx.setLineDash([2, 3]);
      ctx.arc(n.x, n.y, n.r + 3.8, 0, Math.PI*2);
      ctx.strokeStyle = dim ? 'rgba(56,189,248,0.18)' : 'rgba(56,189,248,0.65)';
      ctx.lineWidth = 1.3;
      ctx.stroke();
      ctx.setLineDash([]);
    }

    if(isSel || isHov){
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r + 7, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(56,189,248,0.24)';
      ctx.fill();
    }

    ctx.beginPath();
    ctx.arc(n.x, n.y, n.r, 0, Math.PI*2);
    ctx.fillStyle = col;
    ctx.globalAlpha = dim ? 0.20 : 0.94;
    ctx.fill();
    ctx.lineWidth = isSel ? 2.4 : 1.2;
    ctx.strokeStyle = isSel ? '#ffffff' : 'rgba(15,23,42,0.9)';
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
  ctx.restore(); // back to screen CSS-pixel space

  // 3. Priority Bounding-Box Anti-Overlap Label Culling (screen space)
  const placedRects = [];
  const labelCandidates = [];

  for(const n of graphSim.nodes){
    const isSel = n.rel === graphSelectedRel;
    const isHov = n.rel === graphHoverRel;
    const dim = focusRel && !focusNeighbors.has(n.rel);
    const sx = cx + n.x * scale;
    const sy = cy + n.y * scale;
    const sr = Math.max(3, n.r * scale);

    // Seed placedRects with visible bright circles so labels never sit on top of other circles
    if(!dim && sx >= -sr && sx <= w + sr && sy >= -sr && sy <= h + sr){
      placedRects.push({
        x1: sx - sr - 2,
        y1: sy - sr - 2,
        x2: sx + sr + 2,
        y2: sy + sr + 2,
        circleOwner: n.rel
      });
    }

    if(dim && !isSel && !isHov) continue;
    if(!isSel && !isHov && (sx < -60 || sx > w + 60 || sy < -30 || sy > h + 30)) continue;

    const isFocusNbr = Boolean(focusRel && focusNeighbors.has(n.rel) && !isSel && !isHov);
    const prio = (isSel || isHov) ? 0 : (isFocusNbr ? 1 : 2);
    labelCandidates.push({ n, sx, sy, sr, isSel, isHov, isFocusNbr, prio });
  }

  labelCandidates.sort((a, b) =>
    (a.prio - b.prio) ||
    ((b.n.data.degree || 0) - (a.n.data.degree || 0)) ||
    ((b.n.data.in_degree || 0) - (a.n.data.in_degree || 0)) ||
    a.n.rel.localeCompare(b.n.rel)
  );

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const padX = 8, padY = 4;

  for(const cand of labelCandidates){
    const { n, sx, sy, sr, isSel, isHov, isFocusNbr } = cand;
    const d = n.data;
    const maxChars = (isSel || isHov) ? 38 : 26;
    const lbl = d.title.length > maxChars ? d.title.slice(0, maxChars - 1) + '…' : d.title;
    const fontPx = (isSel || isHov) ? 11.5 : (isFocusNbr ? 10.8 : 10.2);
    ctx.font = `${(isSel || isHov) ? '700' : (isFocusNbr ? '600' : '500')} ${fontPx}px Inter, -apple-system, sans-serif`;
    const tw = ctx.measureText(lbl).width;

    const pillW = tw + 11;
    const pillH = fontPx + 6;
    const pillX = sx - pillW / 2;
    const pillY = sy + sr + 4;

    const box = {
      x1: sx - tw / 2 - padX,
      y1: pillY - padY + 2,
      x2: sx + tw / 2 + padX,
      y2: pillY + pillH + padY - 2
    };

    if(!isSel && !isHov){
      let collides = false;
      for(let i = 0; i < placedRects.length; i++){
        const pr = placedRects[i];
        if(pr.circleOwner === n.rel) continue;
        if(_rectsIntersect(box, pr)){
          collides = true;
          break;
        }
      }
      if(collides) continue;
    }

    placedRects.push(box);
    ctx.fillStyle = (isSel || isHov) ? 'rgba(15,23,42,0.92)' : 'rgba(15,23,42,0.82)';
    _fillRoundedPill(ctx, pillX, pillY, pillW, pillH, 5);
    if(isSel || isHov){
      ctx.strokeStyle = 'rgba(56,189,248,0.55)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
    ctx.fillStyle = (isSel || isHov) ? '#ffffff' : (isFocusNbr ? '#f1f5f9' : '#dbeafe');
    ctx.fillText(lbl, sx, pillY + pillH / 2 + 0.5);
  }

  ctx.restore();
}

function startGraphLoop(){
  if(graphSim.raf) cancelAnimationFrame(graphSim.raf);
  const tick = () => {
    if(filter !== 'graph') return;
    if(graphSim.ticks < GRAPH_COOLING_TICKS || graphSim.dragNode){
      const alpha = graphSim.dragNode ? 0.28 : Math.max(0.06, 1 - graphSim.ticks / GRAPH_COOLING_TICKS);
      stepGraphPhysics(alpha);
      graphSim.ticks++;
      if(graphSim.autoFit && !graphSim.dragNode && !graphSim.panning && (graphSim.ticks % 20 === 0 || graphSim.ticks === GRAPH_COOLING_TICKS)){
        fitGraphToViewport(60);
      }
      drawGraphFrame();
      graphSim.raf = requestAnimationFrame(tick);
    } else {
      if(graphSim.autoFit && !graphSim.dragNode && !graphSim.panning){
        fitGraphToViewport(60);
        graphSim.autoFit = false;
      }
      drawGraphFrame();
      graphSim.raf = 0;
    }
  };
  graphSim.raf = requestAnimationFrame(tick);
}

function hitTestGraphNode(clientX, clientY){
  const canvas = document.getElementById('graph-canvas');
  if(!canvas) return null;
  const rect = canvas.getBoundingClientRect();
  const sx = clientX - rect.left;
  const sy = clientY - rect.top;
  const wx = (sx - (rect.width / 2 + graphSim.camX)) / graphSim.scale;
  const wy = (sy - (rect.height / 2 + graphSim.camY)) / graphSim.scale;
  for(let i = graphSim.nodes.length - 1; i >= 0; i--){
    const n = graphSim.nodes[i];
    const dx = wx - n.x, dy = wy - n.y;
    const pad = 4 / graphSim.scale;
    if(dx*dx + dy*dy <= (n.r + pad)*(n.r + pad)) return n;
  }
  return null;
}

function bindGraphEvents(){
  const canvas = document.getElementById('graph-canvas');
  const tip = document.getElementById('graph-tip');
  if(!canvas) return;

  canvas.onmousedown = e => {
    const hit = hitTestGraphNode(e.clientX, e.clientY);
    graphSim.lastX = e.clientX;
    graphSim.lastY = e.clientY;
    graphSim.moved = false;
    graphSim.autoFit = false;
    if(hit){
      graphSim.dragNode = hit;
      startGraphLoop();
    } else {
      graphSim.panning = true;
    }
    canvas.classList.add('dragging');
  };

  window.onmousemove = e => {
    if(filter !== 'graph') return;
    const dx = e.clientX - graphSim.lastX;
    const dy = e.clientY - graphSim.lastY;
    if(Math.abs(dx) + Math.abs(dy) > 2) graphSim.moved = true;
    graphSim.lastX = e.clientX;
    graphSim.lastY = e.clientY;

    if(graphSim.dragNode){
      graphSim.dragNode.x += dx / graphSim.scale;
      graphSim.dragNode.y += dy / graphSim.scale;
      graphSim.ticks = Math.min(graphSim.ticks, GRAPH_COOLING_TICKS - 45);
      drawGraphFrame();
      return;
    }
    if(graphSim.panning){
      graphSim.camX += dx;
      graphSim.camY += dy;
      drawGraphFrame();
      return;
    }
    const cEl = document.getElementById('graph-canvas');
    if(!cEl) return;
    const rect = cEl.getBoundingClientRect();
    if(e.clientX < rect.left || e.clientX > rect.right || e.clientY < rect.top || e.clientY > rect.bottom){
      if(graphHoverRel){ graphHoverRel = null; if(tip) tip.style.display='none'; drawGraphFrame(); }
      return;
    }
    const hit = hitTestGraphNode(e.clientX, e.clientY);
    const nextHov = hit ? hit.rel : null;
    if(nextHov !== graphHoverRel){
      graphHoverRel = nextHov;
      drawGraphFrame();
    }
    if(hit && tip){
      const d = hit.data;
      const warn = (d.broken_links&&d.broken_links.length) ? `<div style="color:#fda4af">⚠ ${d.broken_links.length} defekte(r) Link</div>`
        : (d.stale_verified ? `<div style="color:#fde68a">🕰️ verified vor ${d.verified_age_days}d</div>` : '');
      tip.innerHTML = `<strong>${esc(d.title)}</strong><div style="color:var(--muted-hi);font-size:.67rem">${esc(d.rel)} · ${d.in_degree}↙ ${d.out_degree}↗</div>${warn}`;
      tip.style.display = 'block';
      tip.style.left = Math.min(rect.width - 240, Math.max(10, e.clientX - rect.left + 14)) + 'px';
      tip.style.top = Math.min(rect.height - 80, Math.max(10, e.clientY - rect.top + 14)) + 'px';
    } else if(tip){
      tip.style.display = 'none';
    }
  };

  window.onmouseup = e => {
    if(filter !== 'graph') return;
    const cEl = document.getElementById('graph-canvas');
    if(cEl) cEl.classList.remove('dragging');
    if(!graphSim.moved){
      const rect = cEl ? cEl.getBoundingClientRect() : null;
      if(rect && e.clientX >= rect.left && e.clientX <= rect.right && e.clientY >= rect.top && e.clientY <= rect.bottom){
        const hit = hitTestGraphNode(e.clientX, e.clientY);
        selectGraphNode(hit ? hit.rel : null, false);
      }
    }
    graphSim.dragNode = null;
    graphSim.panning = false;
  };

  canvas.onwheel = e => {
    e.preventDefault();
    graphSim.autoFit = false;
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left - rect.width / 2;
    const my = e.clientY - rect.top - rect.height / 2;
    const factor = e.deltaY < 0 ? 1.13 : 0.88;
    const nextScale = Math.min(4.0, Math.max(0.18, graphSim.scale * factor));
    const ratio = nextScale / graphSim.scale;
    graphSim.camX = mx - (mx - graphSim.camX) * ratio;
    graphSim.camY = my - (my - graphSim.camY) * ratio;
    graphSim.scale = nextScale;
    drawGraphFrame();
  };
}

function renderMain(){
  if(filter === 'graph'){
    renderGraphMain();
    return;
  }
  const mainEl = document.getElementById('cal-main');
  const y = cur.getFullYear(), m = cur.getMonth();
  const mode = coachMode();

  if(layout==='month'){
    document.getElementById('mlabel').textContent = `${MONTHS[m]} ${y}`;
    const first = new Date(y, m, 1);
    const offset = (first.getDay() + 6) % 7;
    const start = new Date(y, m, 1 - offset);
    const sixthWeekStart = new Date(start.getFullYear(), start.getMonth(), start.getDate() + 35);
    const totalCells = (sixthWeekStart.getMonth() !== m) ? 35 : 42;

    let html = `<div class="dow-row"><div class="dow-cell kw-hdr">KW</div>` +
      DOWS.map((d,i)=>`<div class="dow-cell${i>=5?' wknd':''}">${d}</div>`).join('') +
      `</div><div class="month-grid">`;

    const kwMap = kwPhaseMap();
    for(let i=0;i<totalCells;i++){
      const d = new Date(start.getFullYear(), start.getMonth(), start.getDate()+i);
      const ds = iso(d);
      const dowIdx = i % 7;
      if(dowIdx === 0){
        const kw = getKW(d);
        const mw = (filter==='coach' && mode!=='simple') ? kwMap[String(kw)] : null;
        const phBadge = mw && mw.phase ? `<span class="kw-phase" title="${esc(mw.focus||mw.phase)}">${esc(mw.phase.slice(0,6))}</span>` : '';
        html += `<div class="kw-cell" onclick="openWeekOf('${ds}')" title="Wochenansicht KW ${kw} öffnen"><span>${kw}</span>${phBadge}</div>`;
      }
      const isOther = d.getMonth() !== m;
      const isToday = ds === DATA.today;
      const isWknd = dowIdx >= 5;
      const dayMatches = [];
      DATA.items.forEach((it, idx) => {
        if(keepItem(it) && it.start <= ds && ds <= it.end) dayMatches.push({it, idx});
      });
      const dLabel = (d.getDate()===1 && !isToday) ? `1. ${MONTHS_SHORT[d.getMonth()]}` : d.getDate();
      const shown = dayMatches.slice(0, 3);
      const more = dayMatches.length - shown.length;

      html += `<div class="day${isOther?' other':''}${isToday?' today':''}${isWknd?' wknd':''}" onclick="if(event.target===this||event.target.classList.contains('dhead')||event.target.classList.contains('dnum-txt'))showDayModal('${ds}')">`;
      html += `<div class="dhead"><span class="dnum-txt">${dLabel}</span>${isToday?'<span class="today-tag">Heute</span>':(dayMatches.length>1?`<span class="dcount">${dayMatches.length}</span>`:'')}</div>`;
      for(const {it, idx} of shown){
        const c = compactTitle(it.what);
        const spanInfo = it.start !== it.end ? ` (${it.start.slice(8)}–${it.end.slice(8)})` : '';
        const fbBadge = (mode!=='simple' && it.kind==='workout' && it.status==='done')

          ? `W'bal ${it.w_bal_min_pct!=null?Math.round(it.w_bal_min_pct)+'%':''}${it.matches_burned?' · 🔥'+it.matches_burned:''}`

            <span class="pill-txt">${esc(c.main)}${esc(spanInfo)}</span>
            ${fbBadge}
          </div>
          ${rideMeta?`<div class="pill-meta">${esc(rideMeta)}</div>`:''}

      }

      }
      html += `</div>`;
    }
    html += `</div>`;
    mainEl.innerHTML = html;
  } else if(layout==='week'){
    const dowOffset = (cur.getDay() + 6) % 7;
    const wStart = new Date(cur.getFullYear(), cur.getMonth(), cur.getDate() - dowOffset);
    const wEnd = new Date(wStart.getFullYear(), wStart.getMonth(), wStart.getDate() + 6);
    const kw = getKW(wStart);
    document.getElementById('mlabel').textContent = `KW ${kw} · ${wStart.getDate()}. ${MONTHS_SHORT[wStart.getMonth()]} – ${wEnd.getDate()}. ${MONTHS_SHORT[wEnd.getMonth()]} ${wEnd.getFullYear()}`;

    let html = `<div class="week-list">`;
    for(let i=0;i<7;i++){
      const d = new Date(wStart.getFullYear(), wStart.getMonth(), wStart.getDate()+i);
      const ds = iso(d);
      const isToday = ds === DATA.today;
      const dayMatches = [];
      DATA.items.forEach((it, idx) => {
        if(keepItem(it) && it.start <= ds && ds <= it.end) dayMatches.push({it, idx});
      });
      html += `<div class="wday-row${isToday?' today':''}" onclick="if(event.target===this)showDayModal('${ds}')">
        <div class="wday-left" onclick="showDayModal('${ds}')">
          <span class="wday-dow">${DOWS[i]}${isToday?' · HEUTE':''}</span>
          <span class="wday-date">${d.getDate()}. ${MONTHS_SHORT[d.getMonth()]}</span>
        </div>
        <div class="wday-right">`;
      if(dayMatches.length){
        for(const {it, idx} of dayMatches){
          html += `<div class="row ${it.status==='done'?'is-done':''}" onclick="showItemModal(${idx})">
            ${it.can_toggle ? `<button class="cb-btn ${it.status==='done'?'done':''}" onclick="toggleDatedItem(${idx}, event)" title="Abhaken">${it.status==='done'?'✓':''}</button>` : ''}
            <div class="row-main">
              <div class="row-title">${icon(it)} ${it.time?`<strong>${esc(it.time)}</strong> `:''}${esc(it.what)}</div>
              <div class="row-sub"><span>${esc(it.kind)}${it.subkind?':'+esc(it.subkind):''}</span> · <span>${esc(it.rel)}</span></div>
            </div>
            <span class="tag">${esc(deltaLabel(it.delta))}</span>
          </div>`;
        }
      } else {
        html += `<div class="wday-empty" onclick="showDayModal('${ds}')">${filter==='coach'?'Freies Bewegungsfenster (Klicken für Vorlage)':'Keine Termine eingetragen'}</div>`;
      }
      html += `</div></div>`;
    }
    html += `</div>`;
    mainEl.innerHTML = html;
  } else {
    document.getElementById('mlabel').textContent = `Agenda · ${cur.getFullYear()}`;
    const groups = new Map();
    DATA.items.forEach((it, idx) => {
      if(!keepItem(it) || (it.delta < -14 && it.status !== 'open')) return;
      const ym = it.start.slice(0, 7);
      if(!groups.has(ym)) groups.set(ym, []);
      groups.get(ym).push({it, idx});
    });
    if(!groups.size){
      mainEl.innerHTML = `<div class="agenda-view"><div class="empty-box">Keine Einträge für diesen Filter gefunden.</div></div>`;
    } else {
      let html = `<div class="agenda-view">`;
      for(const [ym, arr] of groups.entries()){
        const [yy, mm] = ym.split('-').map(Number);
        html += `<div class="ag-group"><div class="ag-month-hdr"><span>${MONTHS[mm-1]} ${yy}</span><span>${arr.length} Einträge</span></div>`;
        for(const {it, idx} of arr){
          const dObj = parseIso(it.start);
          const dow = DOWS[(dObj.getDay()+6)%7];
          html += `<div class="ag-item ${it.status==='done'?'is-done':''}" onclick="showItemModal(${idx})">
            <div class="ag-date-col">
              <span class="ag-date-main">${dow}, ${fmtDateDE(it.start).slice(0,6)}</span>
              <span class="ag-date-sub">KW ${getKW(dObj)}${it.time?' · '+esc(it.time):''}</span>
            </div>
            <div class="row-main" style="display:flex;flex-direction:row;align-items:center;gap:9px">
              ${it.can_toggle ? `<button class="cb-btn ${it.status==='done'?'done':''}" onclick="toggleDatedItem(${idx}, event)" title="Abhaken">${it.status==='done'?'✓':''}</button>` : ''}
              <div style="min-width:0">
                <div class="row-title">${icon(it)} ${esc(it.what)}</div>
                <div class="row-sub"><span>${esc(it.rel)}</span></div>
              </div>
            </div>
            <span class="tag ${it.delta<0 && it.status!=='done'?'overdue':(it.kind==='goal'?'goal':'')}">${esc(deltaLabel(it.delta))}</span>
          </div>`;
        }
        html += `</div>`;
      }
      html += `</div>`;
      mainEl.innerHTML = html;
    }
  }
}
